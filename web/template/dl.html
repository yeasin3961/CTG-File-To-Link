<!DOCTYPE html>

      background: #0f0f0f;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .box {
      background: #1c1c1c;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
      text-align: center;
      max-width: 400px;
      width: 100%;
      border: 1px solid #333;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 15px;
      color: #00ffff;
      word-wrap: break-word;
    }
    p {
      margin: 8px 0;
      font-size: 14px;
      color: #bbb;
    }
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }
    .download-btn {
      background: #00ffff;
      color: #000;
      text-decoration: none;
      padding: 12px 20px;
      font-weight: bold;
      border-radius: 8px;
      transition: all 0.3s ease;
      display: block;
      font-size: 16px;
    }
    .download-btn:hover {

      transform: translateY(-2px);
    }
    .get-file-btn {
      background: #24A1DE;
      color: #fff;
      text-decoration: none;
      padding: 12px 20px;
      font-weight: bold;
      border-radius: 8px;
      transition: all 0.3s ease;
      display: block;
      font-size: 16px;
    }
    .get-file-btn:hover {
      background: #1c82b6;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(36, 161, 222, 0.3);
    }
    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #666;
      text-align: center;
    }
    .footer a {
      color: #0ff;
      text-decoration: none;
    }
    .footer b {
      color: #00ffff;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>{{ file_name }}</h1>
    <p><strong>Size:</strong> {{ file_size }}</p>

    <div class="btn-container">

        Template by <b>@AV_BOTz_UPDATE</b>
