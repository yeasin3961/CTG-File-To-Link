<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed Player</title>
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.6.9/plyr.css" />
    <style>
        /* ব্যাকগ্রাউন্ড কালো এবং মার্জিন জিরো */
        body, html { 
            margin: 0; padding: 0; 
            background: #000; 
            width: 100%; height: 100%;
        }

        /* প্লেয়ার কন্টেইনার - এটি একদম উপরে থাকবে */
        .player-wrapper {
            width: 100%;
            max-width: 850px; /* মিডিয়াম সাইজ কন্ট্রোল করার জন্য */
            margin: 0 auto;   /* ডানে-বামে মাঝখানে কিন্তু উপরে থাকবে */
        }

        /* ভিডিওর সাইজ ১৬:৯ অনুপাতে মিডিয়াম দেখাবে */
        .plyr {
            aspect-ratio: 16 / 9;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <video id="player" playsinline controls>
            <!-- আপনার ভিডিওর লিংক এখানে বসবে -->
            <source src="%s" type="video/mp4">
        </video>
    </div>

    <!-- Plyr JS -->
    <script src="https://cdn.plyr.io/3.6.9/plyr.js"></script>
    <script>
        const player = new Plyr('#player', {
            controls: [
                'play-large', 'play', 'progress', 'current-time', 
                'duration', 'mute', 'volume', 'settings', 'fullscreen'
            ]
        });

        // রাইট ক্লিক বন্ধ
        document.addEventListener("contextmenu", e => e.preventDefault());
    </script>
</body>
</html>
