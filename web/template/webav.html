<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed Player</title>
    <!-- Plyr CSS (ভিডিও প্লেয়ারকে সুন্দর করার জন্য) -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.6.9/plyr.css" />
    <style>
        /* পুরো স্ক্রিন জুড়ে ভিডিও রাখার জন্য CSS */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #000; overflow: hidden; 
        }
        .player-container {
            width: 100%; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <div class="player-container">
        <video id="player" playsinline controls>
            <!-- এখানে আপনার ভিডিও লিংক (%s) বসবে -->
            <source src="%s" type="video/mp4">
        </video>
    </div>

    <!-- Plyr JS -->
    <script src="https://cdn.plyr.io/3.6.9/plyr.js"></script>
    <script>
        // প্লেয়ার সেটআপ
        const player = new Plyr('#player', {
            controls: [
                'play-large', 'play', 'progress', 'current-time', 
                'duration', 'mute', 'volume', 'settings', 'fullscreen'
            ],
            hideControls: true // মাউস সরালে কন্ট্রোল লুকিয়ে যাবে
        });

        // রাইট ক্লিক বন্ধ (যাতে কেউ লিংক কপি করতে না পারে)
        document.addEventListener("contextmenu", e => e.preventDefault());
    </script>
</body>
</html>
