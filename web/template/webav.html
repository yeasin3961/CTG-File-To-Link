<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>%s</title> <!-- মুভির নাম -->
    
    <!-- Plyr CSS for Premium Player Look -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.6.9/plyr.css" />
    
    <style>
        /* ইমবেড এর জন্য পেজটি ফুল স্ক্রিন করা হয়েছে */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            background-color: #000; 
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .player-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        /* Plyr এর সাইজ ইমবেড উইন্ডোর সাথে ফিট করা */
        .plyr {
            height: 100%;
            width: 100%;
        }
        /* ভিডিওর ওপর টাইটেল বার (ঐচ্ছিক) */
        .video-title {
            position: absolute;
            top: 10px;
            left: 15px;
            z-index: 10;
            color: rgba(255, 255, 255, 0.8);
            font-family: sans-serif;
            font-size: 14px;
            pointer-events: none;
            text-shadow: 1px 1px 5px #000;
        }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <!-- ভিডিওর টাইটেল শো করবে -->
        <div class="video-title">%s</div> 

        <video id="player" playsinline controls>
            <!-- ভিডিওর আসল লিংক এখানে বসবে -->
            <source src="%s" type="video/mp4">
        </video>
    </div>

    <!-- Plyr JS -->
    <script src="https://cdn.plyr.io/3.6.9/plyr.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const player = new Plyr('#player', {
                controls: [
                    'play-large', 'play', 'progress', 'current-time', 
                    'duration', 'mute', 'volume', 'settings', 
                    'pip', 'fullscreen'
                ],
                // ভিডিও লোড হওয়ার সাথে সাথে অটো-প্লে না হওয়া (ব্রাউজার পলিসি)
                autoplay: false, 
            });
        });
        
        // রাইট ক্লিক বন্ধ রাখা (আপনার আগের কোডের রিকোয়েস্ট অনুযায়ী)
        document.addEventListener("contextmenu", (e) => e.preventDefault());
    </script>
</body>
</html>
